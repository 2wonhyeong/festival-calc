<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 점수 계산기</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --point-color: #00d4ff; 
            --bg-dark: #111;
            --danger-color: #ff4444;
        }

        body { background-color: #000; color: #fff; font-family: sans-serif; padding: 15px; line-height: 1.4; }
        .box { border: 2px solid #fff; padding: 15px; border-radius: 15px; max-width: 480px; margin: 0 auto; }
        h2 { text-align: center; margin-top: 0; letter-spacing: 2px; border-bottom: 2px solid #fff; padding-bottom: 8px; font-size: 1.4rem; }
        
        .game-section { background: var(--bg-dark); border: 1px solid #333; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .game-title { font-size: 1rem; font-weight: bold; color: var(--point-color); margin-bottom: 10px; border-left: 3px solid var(--point-color); padding-left: 8px; }
        
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { margin-bottom: 8px; }
        .input-group.full { grid-column: span 2; }
        
        label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #ccc; }
        input, select { width: 100%; padding: 10px; background: #000; border: 1px solid #555; color: #fff; font-size: 1rem; border-radius: 6px; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--point-color); outline: none; }
        
        .con-score { font-size: 0.85rem; color: #aaa; text-align: right; margin-top: 4px; font-weight: bold; }
        .con-score span { color: var(--point-color); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { width: 100%; padding: 12px; font-weight: bold; font-size: 1rem; border-radius: 6px; cursor: pointer; border: none; }
        .btn-calc { background: #fff; color: #000; grid-column: span 2; padding: 15px; font-size: 1.1rem; }
        .btn-save { background: var(--point-color); color: #000; }
        .btn-reset { background: #333; color: #fff; }
        .btn-excel { background: #1f4e72; color: #fff; grid-column: span 2; margin-top: 5px; }
        .btn-danger { background: #331111; color: #ff9999; grid-column: span 2; margin-top: 5px; font-size: 0.85rem; padding: 8px; border: 1px solid #552222; }
        
        .result-section { background: #222; border: 2px solid var(--point-color); padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .result-title { font-size: 1rem; color: var(--point-color); font-weight: bold; margin-bottom: 5px; }
        #total-result { font-size: 2.2rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(0,212,255,0.3); }
        
        .leaderboard { margin-top: 25px; border-top: 1px solid #444; padding-top: 15px; }
        .lb-title { font-size: 1.1rem; font-weight: bold; color: var(--point-color); margin-bottom: 10px; text-align: center; }
        .table-wrapper { max-height: 250px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; background: #0a0a0a; }
        th, td { border: 1px solid #333; padding: 10px; }
        th { background: #222; color: var(--point-color); position: sticky; top: 0; z-index: 1; }
        
        .btn-del { background: none; color: var(--danger-color); padding: 2px 6px; font-size: 0.85rem; border: 1px solid var(--danger-color); border-radius: 4px; width: auto; display: inline-block; }
        .btn-del:hover { background: var(--danger-color); color: #000; }
        .danger-text { color: var(--danger-color) !important; }
    </style>
</head>
<body>
    <div class="box">
        <h2>통합 점수 계산기</h2>
        
        <div class="game-section" style="border-color: var(--point-color);">
            <div class="grid-inputs">
                <div class="input-group">
                    <label style="color: var(--point-color); font-weight: bold;">👤 참가자 이름 / 닉네임</label>
                    <input type="text" id="player-name" placeholder="이름을 입력하세요">
                </div>
                <div class="input-group">
                    <label style="color: var(--point-color); font-weight: bold;">📞 연락처 (상품 수령용)</label>
                    <input type="tel" id="player-phone" placeholder="010-0000-0000" inputmode="tel">
                </div>
            </div>
        </div>
        
        <div class="game-section">
            <div class="game-title">📊 키링 해체 (만점: 35)</div>
            <div class="grid-inputs">
                <div class="input-group">
                    <label>푼 키링 개수</label>
                    <input type="number" id="g1-solved" placeholder="0" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>남은 시간 (초)</label>
                    <input type="number" id="g1-time" placeholder="0" inputmode="numeric">
                </div>
            </div>
            <div class="con-score">환산 점수: <span id="g1-converted">0.000</span> / 100 점</div>
        </div>

        <div class="game-section">
            <div class="game-title">⚡ 펜라이트 흔들기 (만점: 600)</div>
            <div class="input-group full">
                <label>양손 합산 총 횟수</label>
                <input type="number" id="g2-count" placeholder="0" inputmode="numeric">
            </div>
            <div class="con-score">환산 점수: <span id="g2-converted">0.000</span> / 100 점</div>
        </div>

        <div class="game-section">
            <div class="game-title">🎯 병뚜껑 밀기 (만점: 200)</div>
            <div class="grid-inputs">
                <div class="input-group">
                    <label>기본 점수 (컵 합계)</label>
                    <input type="number" id="g3-score" placeholder="0" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>보너스 배율 (X친 컵)</label>
                    <select id="g3-ratio">
                        <option value="0">0개 (보너스 없음)</option>
                        <option value="0.25">1개 (+25%)</option>
                        <option value="0.5">2개 (+50%)</option>
                        <option value="1.0">3개 (+100%)</option>
                        <option value="1.5">4개 (+150%)</option>
                        <option value="2.0">5개 (+200%)</option>
                        <option value="3.0">6개 (+300%)</option>
                    </select>
                </div>
                <div class="input-group full">
                    <label>실수 (X친 컵에 들어간 횟수)</label>
                    <input type="number" id="g3-miss" value="0" inputmode="numeric">
                </div>
            </div>
            <div class="con-score">환산 점수: <span id="g3-converted">0.000</span> / 100 점</div>
        </div>

        <div class="btn-group">
            <button class="btn-calc" onclick="calculateAll()">1. 통합 점수 산출</button>
            <button class="btn-save" onclick="saveRecord()">2. 현재 기록 저장</button>
            <button class="btn-reset" onclick="resetAll()">입력 초기화</button>
            <button class="btn-excel" onclick="exportToCSV()">📊 전체 데이터 엑셀 다운로드</button>
            <button class="btn-danger" onclick="clearAllRecords()">전체 데이터 초기화</button>
        </div>

        <div class="result-section">
            <div class="result-title">🏆 종합 랭킹 점수 🏆</div>
            <div id="total-result">0.000 / 300 점</div>
        </div>

        <div class="leaderboard">
            <div class="lb-title">🎖️ 실시간 랭킹 리스트</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 20%;">순위</th>
                            <th style="width: 40%;">이름</th>
                            <th style="width: 25%;">점수</th>
                            <th style="width: 15%;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="lb-body">
                        <tr><td colspan="4" style="color:#666;">데이터를 불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // -----------------------------------------------------------------
        // 🛠️ [중요]여기에 본인의 Firebase 콘솔 설정값을 붙여넣으세요!
        // -----------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCeGbGpbP1zJE85Gquzh1J9RBuhQ4x8Zdo",
            authDomain: "festival-calc.firebaseapp.com",
            projectId: "festival-calc",
            storageBucket: "festival-calc.firebasestorage.app",
            messagingSenderId: "204642777691",
            appId: "1:204642777691:web:64c8d05087855903fb1d7e",
            measurementId: "G-PJ3QQMVDXF"
        };
        
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('festival_records');

        let currentScores = { g1: 0, g2: 0, g3: 0, total: 0 };
        let isCalculated = false;
        let globalRecords = [];

        window.onload = function() {
            dbRef.on('value', function(snapshot) {
                const data = snapshot.val();
                globalRecords = [];
                if (data) {
                    for (let key in data) {
                        globalRecords.push({ id: key, ...data[key] });
                    }
                }
                updateLeaderboardDisplay();
            });
        };

        function calculateAll() {
            const g1Solved = parseFloat(document.getElementById('g1-solved').value) || 0;
            const g1Time = parseFloat(document.getElementById('g1-time').value) || 0;
            const g1Raw = g1Solved + g1Time;
            let g1Converted = Math.max(0, Math.min(100, (g1Raw / 35) * 100));
            document.getElementById('g1-converted').innerText = g1Converted.toFixed(3);

            // --- 게임 2: 만보기 흔들기 계산 (600 만점 최종 반영) ---
            const g2Count = parseFloat(document.getElementById('g2-count').value) || 0;
            let g2Converted = Math.max(0, Math.min(100, (g2Count / 600) * 100));
            document.getElementById('g2-converted').innerText = g2Converted.toFixed(3);

            const g3S = parseFloat(document.getElementById('g3-score').value) || 0;
            const g3R = parseFloat(document.getElementById('g3-ratio').value);
            const g3N = parseInt(document.getElementById('g3-miss').value) || 0;
            const g3Raw = g3S + (g3S * g3R) - (g3S * (g3R / 2.5) * g3N);
            
            let g3Converted = Math.pow(Math.max(0, g3Raw) / 200, 0.6) * 100;
            const g3ScoreDisplay = document.getElementById('g3-converted');
            if (g3Raw < 0) g3ScoreDisplay.classList.add('danger-text');
            else g3ScoreDisplay.classList.remove('danger-text');
            
            g3Converted = Math.max(0, Math.min(100, g3Converted));
            g3ScoreDisplay.innerText = g3Converted.toFixed(3);

            const totalScore = g1Converted + g2Converted + g3Converted;
            document.getElementById('total-result').innerText = totalScore.toFixed(3) + ' / 300 점';

            currentScores = { g1: g1Converted, g2: g2Converted, g3: g3Converted, total: totalScore };
            isCalculated = true; 
        }

        function saveRecord() {
            const nameInput = document.getElementById('player-name').value.trim();
            const phoneInput = document.getElementById('player-phone').value.trim();
            
            if (!nameInput) {
                alert('참가자의 이름을 입력해 주세요!');
                return;
            }
            if (!phoneInput) {
                alert('상품 수령을 위한 연락처를 입력해 주세요!');
                return;
            }
            if (!isCalculated) {
                alert('먼저 1. [통합 점수 산출] 버튼을 눌러 점수를 계산해 주세요.');
                return;
            }

            // 클라우드 적재용 정밀 구조화 데이터 객체 생성
            const newRecord = {
                name: nameInput,
                phone: phoneInput, // DB 및 엑셀에만 들어가는 프라이빗 연락처 파트
                keyring: currentScores.g1.toFixed(3),
                manboki: currentScores.g2.toFixed(3),
                bottlecap: currentScores.g3.toFixed(3),
                total: currentScores.total.toFixed(3),
                date: new Date().toLocaleString('ko-KR')
            };

            dbRef.push(newRecord, function(error) {
                if(error) alert('저장 실패: ' + error);
                else {
                    alert(`${nameInput} 님의 기록이 저장되었습니다!`);
                    resetAll();
                }
            });
        }

        function updateLeaderboardDisplay() {
            globalRecords.sort((a, b) => parseFloat(b.total) - parseFloat(a.total));
            const tbody = document.getElementById('lb-body');
            tbody.innerHTML = '';
            
            if (globalRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:#666;">등록된 기록이 없습니다.</td></tr>`;
                return;
            }

            // 연락처(phone)를 렌더링 스코프에서 제외하여 현장 개인정보 완전 차단 가드
            globalRecords.forEach((record, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold; ${idx===0?'color:#ff0;':''}">${idx+1}위</td>
                    <td>${escapeHtml(record.name)}</td>
                    <td style="font-weight:bold; color:var(--point-color);">${record.total} 점</td>
                    <td><button class="btn-del" onclick="deleteRecord('${record.id}')">삭제</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteRecord(id) {
            const target = globalRecords.find(r => r.id === id);
            if (!target) return;
            if (!confirm(`"${target.name}" 님의 기록을 삭제하시겠습니까?`)) return;
            firebase.database().ref('festival_records/' + id).remove();
        }

        function clearAllRecords() {
            if (!confirm("⚠️ 저장된 모든 참가자 데이터가 영구히 삭제됩니다.\n정말로 초기화하시겠습니까?")) return;
            dbRef.remove().then(() => alert("모든 데이터가 초기화되었습니다."));
        }

        function exportToCSV() {
            if (globalRecords.length === 0) { alert('다운로드할 데이터가 없습니다.'); return; }
            // CSV 헤더 파트에 연락처 전용 열(Column) 전격 배치
            let csv = "\uFEFF순위,참가자 이름,연락처,키링 환산점,만보기 환산점,병뚜껑 환산점,최종 통합점수,등록 시간\n";
            globalRecords.sort((a, b) => parseFloat(b.total) - parseFloat(a.total));
            globalRecords.forEach((r, idx) => {
                // 연락처에 하이픈이나 공백이 있어도 포맷이 깨지지 않게 문자열 래핑 가드 처리
                csv += `${idx+1},"${r.name}","${r.phone || ''}",${r.keyring},${r.manboki},${r.bottlecap},${r.total},"${r.date}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "작전본부_최종랭킹_마스터데이터.csv";
            link.click();
        }

        function resetAll() {
            const ids = ['g1-solved','g1-time','g2-count','g3-score','g3-miss','player-name','player-phone'];
            ids.forEach(id => document.getElementById(id).value = '');
            document.getElementById('g3-ratio').value = '0';
            ['g1-converted','g2-converted','g3-converted'].forEach(id => document.getElementById(id).innerText = '0.000');
            document.getElementById('g3-converted').classList.remove('danger-text');
            document.getElementById('total-result').innerText = '0.000 / 300 점';
            currentScores = { g1: 0, g2: 0, g3: 0, total: 0 };
            isCalculated = false;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }
    </script>
</body>
</html>
