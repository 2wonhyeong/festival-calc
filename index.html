<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>병뚜껑 밀기 점수 계산기</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; padding: 20px; line-height: 1.5; }
        .box { border: 2px solid #fff; padding: 20px; border-radius: 15px; max-width: 450px; margin: 0 auto; }
        h2 { text-align: center; margin-top: 0; letter-spacing: 2px; border-bottom: 2px solid #fff; padding-bottom: 10px; }
        
        /* 공식 강조 섹션 */
        .formula-highlight { background: #222; border: 1px solid #0f0; padding: 15px; border-radius: 10px; margin-bottom: 25px; text-align: center; }
        .formula-text { font-size: 1rem; color: #0f0; font-weight: bold; word-break: keep-all; }
        .logic-hint { font-size: 0.85rem; color: #aaa; margin-top: 8px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.95rem; font-weight: bold; color: #fff; }
        input, select { width: 100%; padding: 15px; background: #111; border: 1px solid #fff; color: #fff; font-size: 1.1rem; border-radius: 8px; box-sizing: border-box; }
        
        button { width: 100%; padding: 18px; background: #fff; color: #000; border: none; font-weight: bold; font-size: 1.2rem; margin-top: 10px; border-radius: 8px; cursor: pointer; }
        .reset { background: #333; color: #fff; margin-top: 10px; font-size: 1rem; }
        
        #result { margin-top: 25px; font-size: 2rem; text-align: center; font-weight: bold; min-height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .danger { color: #f00; text-shadow: 0 0 10px rgba(255,0,0,0.5); border: 2px solid #f00; padding: 10px; }
        
        .info-section { margin-top: 30px; border-top: 1px solid #444; padding-top: 20px; }
        .info-title { font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 15px; color: #fff; text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
        th, td { border: 1px solid #444; padding: 10px; }
        th { background: #222; }
    </style>
</head>
<body>
    <div class="box">
        <h2>병뚜껑 밀기 점수 계산기</h2>
        
        <div class="formula-highlight">
            <div class="formula-text">최종 점수 = 기본점수 + (기본점수×배율) - (기본점수×(배율/2)×실수)</div>
        </div>

        <div class="input-group">
            <label>1. 기본 점수 (성공한 컵 합계)</label>
            <input type="number" id="score" placeholder="0" inputmode="numeric">
        </div>

        <div class="input-group">
            <label>2. 보너스 배율 (X친 컵 개수)</label>
            <select id="ratio">
                <option value="0">0개 (보너스 없음)</option>
                <option value="0.25">1개 (+25%)</option>
                <option value="0.5">2개 (+50%)</option>
                <option value="1.0">3개 (+100%)</option>
                <option value="1.5">4개 (+150%)</option>
                <option value="2.0">5개 (+200%)</option>
                <option value="3.0">6개 (+300%)</option>
            </select>
        </div>

        <div class="input-group">
            <label>3. 실수 (X친 컵에 들어간 공)</label>
            <input type="number" id="miss" value="0" inputmode="numeric">
        </div>

        <button onclick="calc()">최종 점수 산출</button>
        <button class="reset" onclick="reset()">초기화</button>

        <div id="result"></div>
    </div>

    <script>
        function calc() {
            const s = parseFloat(document.getElementById('score').value) || 0;
            const r = parseFloat(document.getElementById('ratio').value);
            const n = parseInt(document.getElementById('miss').value) || 0;

            const total = s + (s * r) - (s * (r/2) * n);
            
            const res = document.getElementById('result');
            res.innerText = total.toFixed(3) + ' 점';
            
            if (total < 0) {
                res.classList.add('danger');
            } else {
                res.classList.remove('danger');
                res.style.border = "none"; 
            }
        }

        function reset() {
            document.getElementById('score').value = '';
            document.getElementById('ratio').value = '0';
            document.getElementById('miss').value = '0';
            const res = document.getElementById('result');
            res.innerText = '';
            res.classList.remove('danger');
            res.style.border = "none";
        }
    </script>
</body>
</html>
